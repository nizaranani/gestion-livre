<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Livres</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div class="container mt-4 flex-grow-1">

        <h1 class="text-center m-4">Gestion des Livres</h1>

        <!-- Formulaire -->
        <div class="card mb-4">
            <div class="card-body">

                <form id="formLivre">

                    <div class="row mb-3">

                        <div class="col-md-3">
                            <label for="isbn" class="form-label">ISBN</label>
                            <input type="text" class="form-control" id="isbn">
                        </div>

                        <div class="col-md-3">
                            <label for="titre" class="form-label">Titre</label>
                            <input type="text" class="form-control" id="titre">
                        </div>

                        <div class="col-md-3">
                            <label for="auteur" class="form-label">Auteur</label>
                            <input type="text" class="form-control" id="auteur">
                        </div>

                        <div class="col-md-3">
                            <label for="annee" class="form-label">Année</label>
                            <input type="text" class="form-control" id="annee">
                        </div>

                    </div>

                    <input type="hidden" id="indexModification" value="-1">

                    <button type="button" class="btn btn-primary" id="btnAjouter">
                        Ajouter
                    </button>

                    <button type="button" class="btn btn-secondary" id="btnReinitialiser">
                        Réinitialiser
                    </button>

                    <p id="messageErreur" class="mt-3"></p>

                </form>

            </div>
        </div>

        <!-- Recherche -->
        <div class="mb-4">
            <label for="recherche" class="form-label">
                Rechercher un livre (ISBN, Titre ou Auteur)
            </label>

            <input type="text" class="form-control" id="recherche">
        </div>

        <!-- Tableau -->
        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>ISBN</th>
                    <th>Titre</th>
                    <th>Auteur</th>
                    <th>Année</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="corpsTableau">
            </tbody>

        </table>

    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p class="mb-1">&copy; 2026 Gestion des Livres</p>
            <p class="mb-0">Développé par Nizar Anani</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>

</html>
